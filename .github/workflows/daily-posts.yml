name: Ofertas Mercado Libre -> Instagram

on:
  schedule:
    # 13:00 UTC ~ 09:00/10:00 Chile según horario de verano. Ajusta a gusto.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    # El acceso sin autenticar de Mercado Libre (API y sitio) está bloqueado; ahora
    # usamos la API oficial con OAuth (ver src/mlAuth.js). Se mantiene en
    # self-hosted porque ahí es donde ya se hizo el setup inicial del token
    # (el refresh_token vive en el disco de este equipo, no en GitHub). Si en
    # algún momento confirman que el token autenticado también funciona desde
    # ubuntu-latest, se puede volver a un runner de GitHub sin problema.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Generar investigación y posts del día
        run: npm run research
        env:
          ML_SITE: MLC
          POSTS_PER_DAY: '5'
          MIN_RATING: '4.5'
          MIN_REVIEWS: '10'
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_APP_SECRET: ${{ secrets.ML_APP_SECRET }}
          ML_AFFILIATE_MATT_TOOL: ${{ secrets.ML_AFFILIATE_MATT_TOOL }}
          ML_AFFILIATE_MATT_WORD: ${{ secrets.ML_AFFILIATE_MATT_WORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commitear posts generados
        run: node scripts/commit-if-changed.js posts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: posts

  deploy-pages:
    needs: generate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Publicar en Instagram (si hay credenciales configuradas)
        run: npm run publish
        env:
          PAGES_BASE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Commitear estado de publicación
        run: node scripts/commit-if-changed.js publish
