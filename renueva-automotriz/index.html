<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renueva</title>
<meta name="description" content="Gestión de ventas para automotoras, corredoras de propiedades y tiendas.">
<meta name="theme-color" content="#0D0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Renueva">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="shell" id="shell" data-world="auto">
  <div class="lobby" id="lobby"></div>

  <div class="app" id="app" hidden>
    <section class="screen active" id="scr-panel"></section>
    <section class="screen" id="scr-stock"></section>
    <section class="screen" id="scr-ventas"></section>
    <section class="screen" id="scr-caja"></section>
    <section class="screen" id="scr-equipo"></section>
    <nav class="dock" id="dock" aria-label="Navegación principal"></nav>
    <div id="push-layer"></div>
    <div id="sheet-layer"></div>
  </div>

  <div class="iris" id="iris"></div>
  <div id="toast-wrap" aria-live="polite"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
